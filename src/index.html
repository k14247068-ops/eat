<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Whisper AI 文字起こしアプリ</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { display: flex; height: 100vh; background: #1e1e2e; color: #cdd6f4; }
    nav { width: 220px; background: #181825; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
    nav h3 { color: #89b4fa; margin-bottom: 15px; padding-left: 10px; }
    nav button { background: transparent; border: none; color: #a6adc8; padding: 12px; text-align: left; cursor: pointer; border-radius: 6px; }
    nav button.active { background: #313244; color: #fff; }
    main { flex: 1; padding: 25px; overflow-y: auto; }
    .section { display: none; }
    .section.active { display: block; }
    .card { background: #11111b; padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #313244; }
    .btn { padding: 10px 18px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; margin-right: 8px; margin-bottom: 8px; }
    .btn-red { background: #f38ba8; color: #111; }
    .btn-blue { background: #89b4fa; color: #111; }
    select, input, textarea { width: 100%; padding: 10px; margin-top: 8px; border-radius: 6px; background: #181825; color: #fff; border: 1px solid #45475a; }
  </style>
</head>
<body>
  <nav>
    <h3>Whisper App</h3>
    <button class="active" onclick="showNav('main', this)">🎙️ メイン操作</button>
    <button onclick="showNav('settings', this)">⚙️ 機能設定</button>
  </nav>
  <main>
    <div id="main" class="section active">
      <h2 style="margin-bottom:15px;">メイン操作</h2>
      <div class="card">
        <button class="btn btn-red" id="recBtn" onclick="toggleRec()">🔴 録音する</button>
        <button class="btn btn-blue" onclick="alert('録音データの保存先フォルダを開きます')">📁 録音データ一覧</button>
        <button class="btn btn-blue" onclick="alert('文字起こしテキストの保存先を開きます')">📄 文字起こしデータ確認</button>
        <p id="status" style="margin-top:15px; color:#a6adc8;">ステータス: 待機中</p>
      </div>
      <div class="card">
        <h3>リアルタイム文字起こし</h3>
        <textarea rows="8" readonly placeholder="ここに文字起こしされたデータが表示されます..."></textarea>
      </div>
    </div>
    <div id="settings" class="section">
      <h2 style="margin-bottom:15px;">機能設定・AIチューター</h2>
      <div class="card">
        <label>🎙️ マイク設定</label>
        <select><option>既定のマイク (システム標準)</option><option>外付けUSBマイク</option></select>
      </div>
      <div class="card">
        <label>📂 データ保存先 (録音・テキスト)</label>
        <input type="text" value="C:\Users\Public\Documents\WhisperApp" readonly />
      </div>
      <div class="card">
        <label>🎙️ 録音方法・フォーマット</label>
        <select><option>WAV (高音質)</option><option>MP3 (標準)</option></select>
      </div>
      <div class="card">
        <label>🤖 AIチューター設定 (Whisperモデル)</label>
        <select><option>small (高速)</option><option>medium (標準)</option><option>large-v3 (高精度)</option></select>
        <label style="display:block; margin-top:10px;">プロンプト・指示設定</label>
        <textarea rows="3" placeholder="AIへの指示 (例: 会議の議事録として要約してください)"></textarea>
      </div>
    </div>
  </main>
  <script>
    let rec = false;
    function toggleRec() {
      rec = !rec;
      document.getElementById('recBtn').textContent = rec ? '⏹️ 録音停止' : '🔴 録音する';
      document.getElementById('recBtn').style.background = rec ? '#a6e3a1' : '#f38ba8';
      document.getElementById('status').textContent = rec ? 'ステータス: 🎙️ 録音中...' : 'ステータス: 待機中';
    }
    function showNav(id, btn) {
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      btn.classList.add('active');
    }
  </script>
</body>
</html>
