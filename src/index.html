<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Whisper AI 高精度文字起こし録音アプリ</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --accent: #10b981;
      --danger: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 300px;
      background-color: var(--card-bg);
      border-right: 1px solid var(--border);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .app-title {
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .setting-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .setting-group label {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    select, input[type="text"] {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background-color: var(--bg-color);
      color: var(--text);
      font-size: 0.9rem;
    }

    /* Main Area */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 20px;
      gap: 20px;
      overflow-y: auto;
    }

    /* Recorder Section */
    .recorder-card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 24px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .visualizer {
      width: 100%;
      height: 60px;
      background-color: var(--bg-color);
      border-radius: 8px;
    }

    .timer {
      font-size: 2.5rem;
      font-family: monospace;
      font-weight: bold;
      color: var(--text);
    }

    .controls {
      display: flex;
      gap: 12px;
    }

    button {
      padding: 12px 24px;
      border-radius: 8px;
      border: none;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.95rem;
    }

    .btn-primary { background-color: var(--primary); color: white; }
    .btn-primary:hover { background-color: var(--primary-hover); }
    .btn-danger { background-color: var(--danger); color: white; }
    .btn-secondary { background-color: var(--border); color: var(--text); }

    /* Results Section */
    .results-card {
      flex: 1;
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .transcription-box {
      flex: 1;
      width: 100%;
      background-color: var(--bg-color);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      color: var(--text);
      font-size: 1rem;
      line-height: 1.6;
      resize: none;
      min-height: 200px;
    }

    /* Drop Zone */
    .drop-zone {
      border: 2px dashed var(--border);
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      color: var(--text-muted);
      cursor: pointer;
    }

    .drop-zone:hover {
      border-color: var(--primary);
    }
  </style>
</head>
<body>

  <!-- サイドバー（設定） -->
  <div class="sidebar">
    <div class="app-title">
      🎙️ Whisper 文字起こし
    </div>

    <div class="setting-group">
      <label for="engine">文字起こしエンジン</label>
      <select id="engine">
        <option value="local">ローカル Whisper (高精度・オフライン)</option>
        <option value="openai">OpenAI API (クラウド)</option>
      </select>
    </div>

    <div class="setting-group">
      <label for="model">モデルサイズ (精度/速度)</label>
      <select id="model">
        <option value="small" selected>Small (推奨・バランス型)</option>
        <option value="medium">Medium (高精度・要スペック)</option>
        <option value="base">Base (軽量・高速)</option>
      </select>
    </div>

    <div class="setting-group">
      <label for="language">認識言語</label>
      <select id="language">
        <option value="ja" selected>日本語</option>
        <option value="en">英語</option>
        <option value="auto">自動判定</option>
      </select>
    </div>

    <div class="setting-group" id="api-key-group" style="display: none;">
      <label for="api-key">OpenAI API Key</label>
      <input type="text" id="api-key" placeholder="sk-...">
    </div>
  </div>

  <!-- メイン画面 -->
  <div class="main-content">

    <!-- 録音カード -->
    <div class="recorder-card">
      <canvas id="visualizer" class="visualizer"></canvas>
      <div id="timer" class="timer">00:00:00</div>
      
      <div class="controls">
        <button id="btn-record" class="btn-primary">🔴 録音開始</button>
        <button id="btn-stop" class="btn-danger" disabled>⏹️ 停止 & 文字起こし</button>
      </div>

      <div id="drop-zone" class="drop-zone" style="width: 100%;">
        または音声ファイル（WAV, MP3, M4A）をここにドラッグ＆ドロップ
        <input type="file" id="file-input" accept="audio/*" style="display: none;">
      </div>
    </div>

    <!-- 結果カード -->
    <div class="results-card">
      <div class="results-header">
        <h3>文字起こし結果</h3>
        <div style="display: flex; gap: 8px;">
          <button id="btn-copy" class="btn-secondary">📋 コピー</button>
          <button id="btn-download" class="btn-secondary">💾 保存 (.txt)</button>
        </div>
      </div>
      <textarea id="output" class="transcription-box" placeholder="録音を開始するかファイルをアップロードすると、ここに文字起こしテキストが表示されます..."></textarea>
    </div>

  </div>
