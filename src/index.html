<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Whisper AI (Offline)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { display: flex; height: 100vh; background: #1e1e2e; color: #cdd6f4; }
    nav { width: 220px; background: #181825; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
    nav h3 { color: #89b4fa; margin-bottom: 15px; padding-left: 10px; }
    nav button { background: transparent; border: none; color: #a6adc8; padding: 12px; text-align: left; cursor: pointer; border-radius: 6px; }
    nav button.active { background: #313244; color: #fff; }
    main { flex: 1; padding: 25px; overflow-y: auto; }
    .section { display: none; }
    .section.active { display: block; }
    .card { background: #11111b; padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #313244; }
    .btn { padding: 10px 18px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; margin-right: 8px; margin-bottom: 8px; }
    .btn-red { background: #f38ba8; color: #111; }
    .btn-blue { background: #89b4fa; color: #111; }
    input[type="file"] { background: transparent; border: none; padding: 5px 0; margin-top: 10px; }
    textarea { width: 100%; padding: 10px; margin-top: 8px; border-radius: 6px; background: #181825; color: #fff; border: 1px solid #45475a; }
  </style>
</head>
<body>
  <nav>
    <h3>Whisper App</h3>
    <button class="active">🎙️ 完全オフラインAI</button>
  </nav>
  <main>
    <div class="section active">
      <h2 style="margin-bottom:15px;">完全オフライン文字起こし</h2>
      <div class="card" style="display: flex; gap: 20px;">
        <div style="flex: 1; border-right: 1px solid #313244; padding-right: 20px;">
          <h3>🎙️ マイク録音</h3>
          <button class="btn btn-red" id="recBtn" style="margin-top: 10px;">🔴 録音する</button>
          <p id="status" style="margin-top:10px; color:#a6adc8; font-size: 0.9em;">ステータス: モデル読込中...</p>
        </div>
        <div style="flex: 1; padding-left: 10px;">
          <h3>📁 ファイル解析</h3>
          <input type="file" id="audioFile" accept="audio/*,video/*" />
          <button class="btn btn-blue" id="fileBtn" style="margin-top: 10px;">📤 ファイルを解析</button>
        </div>
      </div>
      <div class="card">
        <h3>🤖 ローカルAI 解析結果</h3>
        <textarea id="transcriptArea" rows="12" readonly placeholder="モデルを読み込んでいます..."></textarea>
      </div>
    </div>
  </main>

  <script type="module">
    import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.16.1';
    env.allowLocalModels = false;

    let transcriber = null;
    let rec = false;
    let mediaRecorder;
    let audioChunks = [];

    async function initModel() {
      const tArea = document.getElementById('transcriptArea');
      const status = document.getElementById('status');
      try {
        tArea.value = "🤖 ローカルAIモデル(Whisper)をダウンロード中...\n（初回のみ数分かかります。完了後は完全オフラインで動作します）";
        transcriber = await pipeline('automatic-speech-recognition', 'Xenova/whisper-tiny');
        tArea.value = "✨ オフラインAIの準備が完了しました！音声を入力してください。";
        status.textContent = "ステータス: 待機中";
      } catch(e) {
        tArea.value = "❌ モデルの読み込みに失敗しました: " + e.message;
      }
    }

    async function processAudio(blob) {
      const tArea = document.getElementById('transcriptArea');
      tArea.value = "🤖 [1/3] 音声をAI用に変換中...\n";
      
      try {
        const audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
        const arrayBuffer = await blob.arrayBuffer();
        const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
        const audioData = audioBuffer.getChannelData(0);

        tArea.value += "🤖 [2/3] あなたのPCの処理能力を使って文字起こしを実行中...\n";
        
        const result = await transcriber(audioData, {
          chunk_length_s: 30,
          stride_length_s: 5,
          language: 'japanese',
          task: 'transcribe',
        });

        tArea.value = "✨ [3/3] 解析完了！\n\n" + result.text;
        document.getElementById('status').textContent = 'ステータス: 待機中';
      } catch (err) {
        tArea.value += `\n❌ エラーが発生しました: ${err.message}`;
      }
    }

    document.getElementById('fileBtn').onclick = () => {
      if(!transcriber) return alert("AIの準備が終わるまでお待ちください");
      const file = document.getElementById('audioFile').files[0];
      if (!file) return alert("音声ファイルを選択してください。");
      document.getElementById('status').textContent = 'ステータス: 📁 ファイルを解析中...';
      processAudio(file);
    };

    document.getElementById('recBtn').onclick = async () => {
      if(!transcriber) return alert("AIの準備が終わるまでお待ちください");
      const btn = document.getElementById('recBtn');
      const status = document.getElementById('status');
      
      if (!rec) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];
          mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
          mediaRecorder.onstop = () => {
            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
            status.textContent = 'ステータス: ローカルAIで解析中...';
            processAudio(audioBlob);
          };
          mediaRecorder.start();
          rec = true;
          btn.textContent = '⏹️ 録音停止'; btn.style.background = '#a6e3a1';
          status.textContent = 'ステータス: 🎙️ 録音中...';
        } catch (err) { alert('マイクエラー: ' + err.message); }
      } else {
        mediaRecorder.stop();
        rec = false;
        btn.textContent = '🔴 録音する'; btn.style.background = '#f38ba8';
      }
    };

    window.onload = initModel;
  </script>
</body>
</html>
