<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Whisper AI 文字起こしアプリ</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { display: flex; height: 100vh; background: #1e1e2e; color: #cdd6f4; }
    nav { width: 220px; background: #181825; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
    nav h3 { color: #89b4fa; margin-bottom: 15px; padding-left: 10px; }
    nav button { background: transparent; border: none; color: #a6adc8; padding: 12px; text-align: left; cursor: pointer; border-radius: 6px; }
    nav button.active { background: #313244; color: #fff; }
    main { flex: 1; padding: 25px; overflow-y: auto; }
    .section { display: none; }
    .section.active { display: block; }
    .card { background: #11111b; padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #313244; }
    .btn { padding: 10px 18px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; margin-right: 8px; margin-bottom: 8px; }
    .btn-red { background: #f38ba8; color: #111; }
    .btn-blue { background: #89b4fa; color: #111; }
    select, input, textarea { width: 100%; padding: 10px; margin-top: 8px; border-radius: 6px; background: #181825; color: #fff; border: 1px solid #45475a; }
  </style>
</head>
<body>
  <nav>
    <h3>Whisper App</h3>
    <button class="active" onclick="showNav('main', this)">🎙️ メイン操作</button>
    <button onclick="showNav('settings', this)">⚙️ 機能設定</button>
  </nav>
  <main>
    <div id="main" class="section active">
      <h2 style="margin-bottom:15px;">メイン操作</h2>
      <div class="card">
        <button class="btn btn-red" id="recBtn" onclick="toggleRec()">🔴 録音する</button>
        <p id="status" style="margin-top:15px; color:#a6adc8;">ステータス: 待機中</p>
      </div>
      <div class="card">
        <h3>リアルタイム文字起こし結果</h3>
        <textarea id="transcriptArea" rows="8" readonly placeholder="ここに文字起こしされたデータが表示されます..."></textarea>
      </div>
    </div>
    <div id="settings" class="section">
      <h2 style="margin-bottom:15px;">機能設定</h2>
      <p style="color:#a6adc8;">※現在、簡易文字起こしエンジンを使用中です。</p>
    </div>
  </main>
  <script>
    let rec = false;
    let mediaRecorder;
    let audioChunks = [];
    
    // 文字起こし機能のセットアップ
    let recognition;
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRec();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = 'ja-JP'; // 日本語に設定

      recognition.onresult = (event) => {
        let transcript = '';
        for (let i = 0; i < event.results.length; i++) {
          transcript += event.results[i][0].transcript;
        }
        document.getElementById('transcriptArea').value = transcript;
      };
    }

    async function toggleRec() {
      const btn = document.getElementById('recBtn');
      const status = document.getElementById('status');
      const transcriptArea = document.getElementById('transcriptArea');

      if (!rec) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];
          
          mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
          mediaRecorder.onstop = () => {
            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(audioBlob);
            a.download = '録音データ_' + Date.now() + '.webm';
            a.click();
            status.textContent = 'ステータス: 録音完了！音声ファイルを保存しました。';
          };

          mediaRecorder.start();
          if (recognition) {
            transcriptArea.value = ''; // 前回のテキストをクリア
            recognition.start();
          }
          
          rec = true;
          btn.textContent = '⏹️ 録音停止';
          btn.style.background = '#a6e3a1';
          status.textContent = 'ステータス: 🎙️ 録音＆文字起こし中...';
        } catch (err) { alert('マイクエラー: ' + err.message); }
      } else {
        mediaRecorder.stop();
        if (recognition) recognition.stop();
        rec = false;
        btn.textContent = '🔴 録音する';
        btn.style.background = '#f38ba8';
      }
    }

    function showNav(id, btn) {
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      btn.classList.add('active');
    }
  </script>
</body>
</html>
