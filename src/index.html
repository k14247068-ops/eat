<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Whisper App (Offline)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { display: flex; height: 100vh; background: #1e1e2e; color: #cdd6f4; }
    nav { width: 220px; background: #181825; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
    nav h3 { color: #89b4fa; margin-bottom: 15px; padding-left: 10px; }
    nav button { background: transparent; border: none; color: #a6adc8; padding: 12px; text-align: left; cursor: pointer; border-radius: 6px; width: 100%; }
    nav button.active { background: #313244; color: #fff; }
    main { flex: 1; padding: 25px; overflow-y: auto; }
    .section { display: none; }
    .section.active { display: block; }
    .card { background: #11111b; padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #313244; }
    .btn { padding: 10px 18px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; margin-right: 8px; margin-bottom: 8px; }
    .btn-red { background: #f38ba8; color: #111; }
    .btn-blue { background: #89b4fa; color: #111; }
    .btn-green { background: #a6e3a1; color: #111; }
    input[type="file"] { background: transparent; border: none; padding: 5px 0; margin-top: 10px; }
    textarea, select { width: 100%; padding: 10px; margin-top: 8px; border-radius: 6px; background: #181825; color: #fff; border: 1px solid #45475a; }
    label { font-size: 0.9em; color: #a6adc8; display: block; margin-top: 10px; }
  </style>
</head>
<body>
  <nav>
    <h3>Whisper App</h3>
    <button class="active" id="tabMain">🎙️ 文字起こし</button>
    <button id="tabSettings">⚙️ 設定</button>
  </nav>
  <main>
    <!-- 文字起こし画面 -->
    <div class="section active" id="secMain">
      <h2 style="margin-bottom:15px;">完全オフライン文字起こし ＆ 自動整理</h2>
      <div class="card" style="display: flex; gap: 20px;">
        <div style="flex: 1; border-right: 1px solid #313244; padding-right: 20px;">
          <h3>🎙️ マイク録音</h3>
          <button class="btn btn-red" id="recBtn" style="margin-top: 10px;">🔴 録音する</button>
          <p id="status" style="margin-top:10px; color:#a6adc8; font-size: 0.9em;">ステータス: モデル読込中...</p>
        </div>
        <div style="flex: 1; padding-left: 10px;">
          <h3>📁 ファイル解析</h3>
          <input type="file" id="audioFile" accept="audio/*,video/*" />
          <button class="btn btn-blue" id="fileBtn" style="margin-top: 10px;">📤 ファイルを解析</button>
        </div>
      </div>
      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
          <h3>🤖 ローカルAI 解析結果 ＆ 自動保存</h3>
          <span id="autoSaveStatus" style="font-size: 0.85em; color: #a6e3a1;"></span>
        </div>
        <textarea id="transcriptArea" rows="12" readonly placeholder="モデルを読み込んでいます..."></textarea>
      </div>
    </div>

    <!-- 設定画面 -->
    <div class="section" id="secSettings">
      <h2 style="margin-bottom:15px;">アプリ設定</h2>
      <div class="card">
        <h3>🔧 AI 動作設定</h3>
        <label>認識言語</label>
        <select id="langSelect">
          <option value="japanese">日本語 (Japanese)</option>
          <option value="english">英語 (English)</option>
        </select>

        <label style="margin-top: 15px;">タスク</label>
        <select id="taskSelect">
          <option value="transcribe">文字起こし (Transcribe)</option>
          <option value="translate">英語へ翻訳 (Translate to English)</option>
        </select>
      </div>
    </div>
  </main>

  <script type="module">
    import { initApp, setupListeners } from './app.js';
    window.onload = async () => {
      setupListeners();
      await initApp();
    };
  </script>
</body>
</html>
